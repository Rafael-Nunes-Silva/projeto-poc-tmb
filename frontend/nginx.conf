server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Try to serve file directly, if not found -> fallback to index.html
  location / {
    try_files $uri /index.html;
  }

  # Optional: serve static assets efficiently
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
    expires 6M;
    access_log off;
  }
}
